<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>要知简报</title>
<style>
:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card2: #2c2c2e;
  --text: #ffffff;
  --muted: #8e8e93;
  --muted2: #636366;
  --pill: #3a3a3c;
  --red: #ff3b30;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --nav-h: 64px;
  --radius: 16px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  height: 100%;
  overflow: hidden;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; }
ol, ul { margin: 0; padding: 0; list-style: none; }
h1, h2, p { margin: 0; }

.app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}
.page {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.page[hidden] { display: none !important; }

.scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 14px;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }
.bottom-spacer { height: calc(var(--nav-h) + var(--safe-b) + 24px); }

/* Header — date left, actions right */
.home-header {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  justify-content: space-between;
  padding: 14px 14px 6px;
  flex-shrink: 0;
  gap: 12px;
}
.date-block { min-width: 0; flex: 1; }
.date-big {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 0.2px;
  line-height: 1.1;
}
.date-sub {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.3;
}
.header-actions {
  display: flex;
  flex-direction: row;
  gap: 8px;
  padding-top: 4px;
  flex-shrink: 0;
}
.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--card);
  display: grid;
  place-items: center;
  color: #ddd;
}
.icon-btn.busy { opacity: 0.45; }

.plaza-header, .me-header {
  display: flex;
  align-items: center;
  padding: 16px 14px 8px;
  flex-shrink: 0;
  gap: 12px;
}
.plaza-header h1, .me-header h1 {
  font-size: 28px;
  font-weight: 700;
}

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 14px 8px;
  margin-bottom: 12px;
}
.card-head {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
  gap: 8px;
}
.card-head h2 {
  font-size: 17px;
  font-weight: 700;
}
.card-head.sticky {
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 2;
  padding: 4px 0 8px;
}

.pill-play, .pill-more {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 5px;
  background: var(--pill);
  color: #eee;
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}
.play-dot {
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 5px 0 5px 8px;
  border-color: transparent transparent transparent var(--red);
}
.pill-more span { opacity: 0.7; }

.section-head {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  justify-content: space-between;
  margin: 10px 2px 10px;
  gap: 8px;
}
.section-head h2 {
  font-size: 20px;
  font-weight: 700;
}
.section-links {
  display: flex;
  flex-direction: row;
  gap: 12px;
  flex-shrink: 0;
}
.text-link {
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}
.agg-label {
  color: var(--muted);
  font-size: 12px;
  margin: 8px 4px 6px;
}

/* Numbered list — dense like 要知 */
.num-list { display: flex; flex-direction: column; }
.num-list li {
  display: flex;
  flex-direction: row;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.045);
  cursor: pointer;
}
.num-list li:last-child { border-bottom: 0; }
.num-list .n {
  flex: 0 0 20px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #2a2a2c;
  color: #b0b0b5;
  font-size: 11px;
  font-weight: 650;
  display: grid;
  place-items: center;
  margin-top: 2px;
}
.num-list .n.top {
  background: rgba(255, 59, 48, 0.2);
  color: #ff6961;
}
.num-list .t {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  line-height: 1.42;
  color: #f2f2f7;
  font-weight: 450;
}
.num-list .sub {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  font-weight: 400;
}

/* Mine / source cards — default 横排 swipe */
.mine-cards.vertical .src-card { margin-bottom: 12px; }
.mine-cards.horizontal {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  padding: 2px 14px 10px;
  margin: 0 -14px 8px;
}
.mine-cards.horizontal::-webkit-scrollbar { display: none; }
.mine-cards.horizontal .src-card {
  flex: 0 0 82%;
  width: 82%;
  max-width: 340px;
  scroll-snap-align: center;
  margin-bottom: 0;
  max-height: 420px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.src-head {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}
.src-icon {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.src-name {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.src-card .num-list .n {
  background: transparent;
  color: var(--muted);
  border-radius: 0;
  font-size: 13px;
  width: auto;
  height: auto;
  font-weight: 600;
}

/* Timeline */
.timeline {
  position: relative;
  padding: 4px 0 4px 16px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 3px;
  top: 10px;
  bottom: 14px;
  width: 1px;
  background: #3a3a3c;
}
.timeline li {
  position: relative;
  padding: 0 0 14px 8px;
  cursor: pointer;
}
.timeline li:last-child { padding-bottom: 6px; }
.timeline li::before {
  content: '';
  position: absolute;
  left: -15px;
  top: 6px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1.5px solid #d8d8dc;
  background: var(--card);
  box-sizing: border-box;
}
.tl-meta {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 3px;
  line-height: 1.3;
}
.tl-title {
  font-size: 14.5px;
  line-height: 1.4;
  color: #f2f2f7;
  font-weight: 450;
}

.foot-hint {
  color: var(--muted2);
  font-size: 11.5px;
  text-align: center;
  padding: 10px 10px 0;
  line-height: 1.5;
}

/* Plaza */
.chips {
  display: flex;
  flex-direction: row;
  gap: 16px;
  padding: 2px 14px 10px;
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  color: var(--muted);
  font-size: 15px;
  padding-bottom: 7px;
  position: relative;
}
.chip.active {
  color: #fff;
  font-weight: 650;
}
.chip.active::after {
  content: '';
  position: absolute;
  left: 18%;
  right: 18%;
  bottom: 0;
  height: 2px;
  background: var(--red);
  border-radius: 2px;
}
.plaza-list { padding: 0 14px; }
.plaza-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.plaza-icon {
  width: 42px;
  height: 42px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 13px;
  color: #fff;
  flex-shrink: 0;
}
.plaza-info { flex: 1; min-width: 0; }
.plaza-info .name {
  font-size: 15.5px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.plaza-info .meta {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}
.btn-sub {
  flex-shrink: 0;
  min-width: 70px;
  padding: 7px 12px;
  border-radius: 9px;
  background: var(--pill);
  color: #eee;
  font-size: 13px;
  text-align: center;
}
.btn-sub.on { color: #a8a8ad; }

/* Me */
.avatar {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff6b61, #8b5cf6);
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: 700;
  flex-shrink: 0;
}
.me-sub {
  margin-top: 3px;
  color: var(--muted);
  font-size: 13px;
}
.me-menu {
  margin: 6px 14px;
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
}
.me-row {
  width: 100%;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  padding: 15px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 15.5px;
  text-align: left;
}
.me-menu li:last-child .me-row { border-bottom: 0; }
.me-row b { color: var(--muted); font-weight: 500; }
.chev { color: var(--muted2); font-size: 18px; }

/* Floating tab bar */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(10px + var(--safe-b));
  transform: translateX(-50%);
  display: flex;
  flex-direction: row;
  gap: 2px;
  background: rgba(44, 44, 46, 0.94);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 999px;
  padding: 5px 6px;
  z-index: 40;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  max-width: calc(100vw - 28px);
}
.tabbar .tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  min-width: 72px;
  padding: 7px 10px;
  border-radius: 999px;
  color: #9a9a9e;
  font-size: 10.5px;
}
.tabbar .tab.active {
  background: rgba(0,0,0,0.48);
  color: #fff;
}

/* Sheet */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet[hidden] { display: none !important; }
.sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}
.sheet-panel {
  position: relative;
  width: 100%;
  max-width: 480px;
  max-height: 82vh;
  overflow-y: auto;
  background: #1c1c1e;
  border-radius: 20px 20px 0 0;
  padding: 8px 18px calc(22px + var(--safe-b));
  animation: slideUp 0.25s ease;
}
.sheet-panel.tall { max-height: 88vh; }
@keyframes slideUp {
  from { transform: translateY(36px); opacity: 0.65; }
  to { transform: translateY(0); opacity: 1; }
}
.sheet-grab {
  width: 34px;
  height: 4px;
  border-radius: 4px;
  background: #555;
  margin: 4px auto 12px;
}
.sheet-meta {
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.chip-src, .chip-hot {
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--pill);
  color: #ccc;
}
.chip-hot:empty { display: none; }
#sheetTitle {
  margin: 0 0 8px;
  font-size: 19px;
  line-height: 1.35;
  font-weight: 700;
}
.sheet-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.sheet-tags span {
  font-size: 12px;
  color: #aaa;
  background: #2c2c2e;
  padding: 3px 8px;
  border-radius: 6px;
}
.ai-box {
  background: #111;
  border: 1px solid #2c2c2e;
  border-radius: 12px;
  padding: 11px 12px;
  margin-bottom: 10px;
}
.ai-label {
  font-size: 12px;
  color: #8b8b90;
  margin-bottom: 7px;
}
#sheetBullets {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
#sheetBullets li {
  position: relative;
  padding-left: 12px;
  font-size: 14px;
  line-height: 1.5;
  color: #e8e8ed;
}
#sheetBullets li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 7px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--red);
}
.sheet-summary {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
  margin: 0 0 16px;
}
.sheet-actions {
  display: flex;
  flex-direction: row;
  gap: 10px;
  align-items: center;
}
.btn-secondary {
  flex: 1;
  background: var(--pill);
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
  font-weight: 650;
}
.btn-ghost {
  color: var(--muted);
  font-size: 13px;
  text-decoration: none;
  padding: 10px 8px;
}
.btn-ghost[hidden] { display: none !important; }

.empty {
  color: var(--muted);
  text-align: center;
  padding: 20px 10px;
  font-size: 13px;
  list-style: none;
}

@media (min-width: 520px) {
  .app {
    border-left: 1px solid #141414;
    border-right: 1px solid #141414;
  }
}

</style>
</head>
<body>
<div class="app" id="app">
    <section class="page active" id="page-home" data-page="home">
      <header class="home-header">
        <div class="date-block">
          <h1 class="date-big" id="dateBig">—</h1>
          <p class="date-sub" id="dateSub">—</p>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="btnSearch" aria-label="搜索" title="搜索">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btnRefresh" aria-label="刷新" title="刷新">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </header>

      <div class="scroll" id="homeScroll">
        <article class="card morning-card">
          <div class="card-head">
            <h2>早报</h2>
            <button type="button" class="pill-play" id="btnBroadcast">
              <span class="play-dot" aria-hidden="true"></span>一键播报
            </button>
          </div>
          <ol class="num-list" id="morningList"></ol>
        </article>

        <div class="section-head">
          <h2>我的订阅</h2>
          <div class="section-links">
            <button type="button" class="text-link" id="btnLayout">转为竖排</button>
            <button type="button" class="text-link" id="btnManage">订阅管理</button>
          </div>
        </div>
        <div id="mineCards" class="mine-cards horizontal"></div>

        <div class="agg-label">订阅聚合</div>
        <article class="card timeline-card">
          <div class="card-head">
            <h2>24 小时热榜</h2>
            <button type="button" class="pill-more" id="btnTimelineAll">查看全部 <span>›</span></button>
          </div>
          <ul class="timeline" id="hotTimeline"></ul>
        </article>

        <article class="card timeline-card tech-card">
          <div class="card-head">
            <h2>科技大事</h2>
            <button type="button" class="pill-more" id="btnTechCal">查看日历 <span>›</span></button>
          </div>
          <ul class="timeline tech-timeline" id="techTimeline"></ul>
        </article>

        <p class="foot-hint" id="updatedHint">加载中…</p>
        <div class="bottom-spacer"></div>
      </div>
    </section>

    <section class="page" id="page-plaza" data-page="plaza" hidden>
      <header class="plaza-header">
        <h1>订阅广场</h1>
      </header>
      <div class="chips" id="catChips" role="tablist"></div>
      <div class="scroll plaza-scroll">
        <ul class="plaza-list" id="plazaList"></ul>
        <div class="bottom-spacer"></div>
      </div>
    </section>

    <section class="page" id="page-me" data-page="me" hidden>
      <header class="me-header">
        <div class="avatar">知</div>
        <div>
          <h1>要知读者</h1>
          <p class="me-sub" id="meSub">本地简报 · 无需登录</p>
        </div>
      </header>
      <ul class="me-menu">
        <li><button type="button" class="me-row" data-me="subs"><span>我的订阅</span><b id="meSubCount">0</b></button></li>
        <li><button type="button" class="me-row" data-me="history"><span>阅读历史</span><span class="chev">›</span></button></li>
        <li><button type="button" class="me-row" data-me="fav"><span>收藏</span><span class="chev">›</span></button></li>
        <li><button type="button" class="me-row" data-me="settings"><span>设置</span><span class="chev">›</span></button></li>
        <li><button type="button" class="me-row" data-me="about"><span>关于</span><span class="chev">›</span></button></li>
      </ul>
      <p class="foot-hint">摘要内嵌展示，点击标题不会跳转离开本页。</p>
    </section>
  </div>

  <nav class="tabbar" id="tabbar">
    <button type="button" class="tab active" data-nav="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 3.2 3.5 10.2V21h6.2v-6.2h4.6V21h6.2V10.2L12 3.2z"/></svg>
      <span>首页</span>
    </button>
    <button type="button" class="tab" data-nav="plaza">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
      <span>订阅广场</span>
    </button>
    <button type="button" class="tab" data-nav="me">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4zm0 1.8c-3.6 0-8 1.8-8 5.4V21h16v-1.8c0-3.6-4.4-5.4-8-5.4z"/></svg>
      <span>我</span>
    </button>
  </nav>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grab"></div>
      <div class="sheet-meta">
        <span class="chip-src" id="sheetSource"></span>
        <span class="chip-hot" id="sheetHot"></span>
      </div>
      <h2 id="sheetTitle"></h2>
      <div class="sheet-tags" id="sheetTags"></div>
      <div class="ai-box">
        <div class="ai-label">要点摘要</div>
        <ul id="sheetBullets"></ul>
      </div>
      <p class="sheet-summary" id="sheetSummary"></p>
      <div class="sheet-actions">
        <button type="button" class="btn-secondary" id="sheetDismiss">收起</button>
        <a class="btn-ghost" id="sheetLink" href="#" target="_blank" rel="noopener noreferrer" hidden>查看原文</a>
      </div>
    </div>

<script>

(function () {
  "use strict";
  var SUBS_KEY = "yaozhi_subs_v3";
  var LAYOUT_KEY = "yaozhi_layout_v4";
  var HIST_KEY = "yaozhi_hist_v3";
  var CATS = ["全部", "综合", "科技", "娱乐", "财经", "汽车"];
  var DATA = null;
  var activeCat = "全部";
  var layout = "horizontal";
  var speaking = false;

  try { layout = localStorage.getItem(LAYOUT_KEY) || "horizontal"; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function defaultSubs() {
    var list = (DATA && DATA.sources) || [];
    var out = [];
    for (var i = 0; i < list.length; i++) if (list[i].defaultOn) out.push(list[i].id);
    return out.length ? out : ["weibo_hot", "zhihu_hot", "toutiao_hot", "ithome_daily", "baidu_hot"];
  }
  function loadSubs() {
    try {
      var raw = localStorage.getItem(SUBS_KEY);
      if (!raw) return defaultSubs();
      var arr = JSON.parse(raw);
      if (!arr || !arr.length) return defaultSubs();
      var known = {};
      var sources = (DATA && DATA.sources) || [];
      for (var i = 0; i < sources.length; i++) known[sources[i].id] = 1;
      var filtered = [];
      for (var j = 0; j < arr.length; j++) if (!sources.length || known[arr[j]]) filtered.push(arr[j]);
      return filtered.length ? filtered : defaultSubs();
    } catch (e) { return defaultSubs(); }
  }
  function saveSubs(subs) {
    try { localStorage.setItem(SUBS_KEY, JSON.stringify(subs)); } catch (e) {}
  }
  function sourceById(id) {
    var sources = (DATA && DATA.sources) || [];
    for (var i = 0; i < sources.length; i++) if (sources[i].id === id) return sources[i];
    return null;
  }
  function minsLabel(m) {
    if (m == null) return "刚刚";
    if (m < 1) return "刚刚";
    if (m < 60) return m + "分钟前";
    if (m < 1440) return Math.floor(m / 60) + "小时前";
    return Math.floor(m / 1440) + "天前";
  }
  function pushHistory(item) {
    try {
      var arr = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
      arr.unshift({ title: item.title, at: Date.now(), source: item.sourceName || "" });
      localStorage.setItem(HIST_KEY, JSON.stringify(arr.slice(0, 50)));
    } catch (e) {}
  }

  function setDateHeader() {
    var elBig = $("dateBig"), elSub = $("dateSub");
    if (!elBig || !elSub) return;
    var now = new Date();
    elBig.textContent = now.toLocaleDateString("zh-CN", { timeZone: "Asia/Shanghai", month: "long", day: "numeric" });
    var week = now.toLocaleDateString("zh-CN", { timeZone: "Asia/Shanghai", weekday: "long" });
    var lunar = "";
    try {
      lunar = "农历" + new Intl.DateTimeFormat("zh-CN-u-ca-chinese", {
        timeZone: "Asia/Shanghai", month: "long", day: "numeric"
      }).format(now).replace(/\s/g, "");
    } catch (e) {}
    elSub.textContent = lunar ? week + " " + lunar : week;
  }

  function openSheet(item, source) {
    pushHistory({ title: item.title, sourceName: (source && source.name) || item.sourceName || "" });
    $("sheetSource").textContent = (source && source.name) || item.sourceName || "资讯";
    $("sheetHot").textContent = item.hot ? ("热度 " + item.hot) : "";
    $("sheetTitle").textContent = item.title;
    var tags = item.tags || [(source && source.cat), (source && source.name)].filter(Boolean);
    $("sheetTags").innerHTML = tags.filter(Boolean).slice(0, 4).map(function (t) {
      return "<span>" + escapeHtml(t) + "</span>";
    }).join("");
    var bullets = (item.bullets && item.bullets.length) ? item.bullets : [item.summary || item.title];
    $("sheetBullets").innerHTML = bullets.slice(0, 4).map(function (b) {
      return "<li>" + escapeHtml(b) + "</li>";
    }).join("");
    $("sheetSummary").textContent = item.summary || "";
    var a = $("sheetLink");
    if (item.url) { a.hidden = false; a.href = item.url; }
    else { a.hidden = true; a.removeAttribute("href"); }
    $("sheet").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeSheet() { $("sheet").hidden = true; document.body.style.overflow = ""; }
  function closeSourceSheet() { $("sourceSheet").hidden = true; document.body.style.overflow = ""; }

  function itemRow(it, i, withSummary) {
    var nClass = i < 3 ? "n top" : "n";
    var sub = "";
    if (withSummary && it.summary) {
      sub = '<span class="sub">' + escapeHtml(it.summary.slice(0, 72)) + (it.summary.length > 72 ? "…" : "") + "</span>";
    }
    return '<li data-i="' + i + '" role="button" tabindex="0"><span class="' + nClass + '">' + (i + 1) +
      '</span><span class="t">' + escapeHtml(it.title) + sub + "</span></li>";
  }
  function bindItemClicks(root, src) {
    $$("li[data-i]", root).forEach(function (li) {
      li.onclick = function (e) {
        e.preventDefault();
        var it = src.items[Number(li.getAttribute("data-i"))];
        if (it) openSheet(it, src);
      };
    });
  }

  function openSourceSheet(src) {
    $("sourceSheetTitle").textContent = src.name;
    var list = $("sourceSheetList");
    if (!src.items || !src.items.length) {
      list.innerHTML = '<li class="empty">暂无条目</li>';
    } else {
      list.innerHTML = src.items.map(function (it, i) { return itemRow(it, i, true); }).join("");
      bindItemClicks(list, src);
    }
    $("sourceSheet").hidden = false;
    document.body.style.overflow = "hidden";
  }

  function renderMorning() {
    var list = $("morningList");
    if (!list) return;
    var items = (DATA && DATA.morning) || [];
    if (!items.length) { list.innerHTML = '<li class="empty">暂无早报</li>'; return; }
    list.innerHTML = items.map(function (it, i) {
      var nClass = i < 3 ? "n top" : "n";
      return '<li data-mi="' + i + '" role="button"><span class="' + nClass + '">' + (i + 1) +
        '</span><span class="t">' + escapeHtml(it.title) + "</span></li>";
    }).join("");
    $$("li[data-mi]", list).forEach(function (li) {
      li.onclick = function (e) {
        e.preventDefault();
        var it = items[Number(li.getAttribute("data-mi"))];
        if (it) openSheet(it, sourceById(it.sourceId) || { name: it.sourceName });
      };
    });
  }

  function renderMine() {
    var wrap = $("mineCards");
    if (!wrap) return;
    var subs = loadSubs();
    wrap.className = "mine-cards " + (layout === "horizontal" ? "horizontal" : "vertical");
    var btnLayout = $("btnLayout");
    if (btnLayout) btnLayout.textContent = layout === "horizontal" ? "转为竖排" : "转为横排";
    var cards = [];
    for (var s = 0; s < subs.length; s++) {
      var src = sourceById(subs[s]);
      if (!src) continue;
      var items = (src.items || []).slice(0, 10);
      var body = items.length
        ? '<ol class="num-list">' + items.map(function (it, i) { return itemRow(it, i, false); }).join("") + "</ol>"
        : '<p class="empty">' + (src.status === "unavailable" ? "暂不可用" : "暂无更新") + "</p>";
      cards.push(
        '<article class="card src-card" data-src="' + src.id + '"><div class="src-head">' +
        '<div class="src-icon" style="background:' + (src.color || "#444") + '">' + escapeHtml(src.icon || src.name.slice(0, 1)) + "</div>" +
        '<div class="src-name">' + escapeHtml(src.name) + "</div>" +
        '<button type="button" class="pill-more btn-all" data-all="' + src.id + '">查看全部 <span>›</span></button></div>' +
        body + "</article>"
      );
    }
    wrap.innerHTML = cards.length ? cards.join("") : '<p class="empty">还没有订阅。去「订阅广场」挑几个吧。</p>';
    $$(".btn-all", wrap).forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var src = sourceById(btn.getAttribute("data-all"));
        if (src) openSourceSheet(src);
      };
    });
    $$(".src-card", wrap).forEach(function (card) {
      var src = sourceById(card.getAttribute("data-src"));
      if (src) bindItemClicks(card, src);
    });
    var c = $("meSubCount");
    if (c) c.textContent = String(subs.length);
  }

  function renderTimeline() {
    var ul = $("hotTimeline");
    if (!ul) return;
    var items = ((DATA && DATA.timeline) || []).slice(0, 20);
    if (!items.length) { ul.innerHTML = '<li class="empty">暂无热榜</li>'; return; }
    ul.innerHTML = items.map(function (it, i) {
      return '<li data-ti="' + i + '"><div class="tl-meta">' + minsLabel(it.minsAgo) + " · " +
        escapeHtml(it.sourceName || "") + '</div><div class="tl-title">' + escapeHtml(it.title) + "</div></li>";
    }).join("");
    $$("li[data-ti]", ul).forEach(function (li) {
      li.onclick = function (e) {
        e.preventDefault();
        var it = items[Number(li.getAttribute("data-ti"))];
        if (it) openSheet(it, sourceById(it.sourceId) || { name: it.sourceName });
      };
    });
  }

  function renderTech() {
    var ul = $("techTimeline");
    if (!ul) return;
    var items = (DATA && DATA.techEvents) || [];
    ul.innerHTML = items.map(function (it) {
      return '<li><div class="tl-meta">' + escapeHtml(it.time) + " · " + escapeHtml(it.place || "") +
        '</div><div class="tl-title">' + escapeHtml(it.title) + "</div></li>";
    }).join("");
  }

  function renderChips() {
    var box = $("catChips");
    if (!box) return;
    box.innerHTML = CATS.map(function (c) {
      return '<button type="button" class="chip' + (c === activeCat ? " active" : "") + '" data-cat="' + c + '">' + c + "</button>";
    }).join("");
    $$(".chip", box).forEach(function (btn) {
      btn.onclick = function () {
        activeCat = btn.getAttribute("data-cat");
        renderChips();
        renderPlaza();
      };
    });
  }

  function renderPlaza() {
    var list = $("plazaList");
    if (!list) return;
    var subs = {};
    loadSubs().forEach(function (id) { subs[id] = 1; });
    var rows = (DATA && DATA.sources) || [];
    if (activeCat !== "全部") rows = rows.filter(function (s) { return s.cat === activeCat; });
    if (!rows.length) { list.innerHTML = '<li class="empty">该分类暂无信源</li>'; return; }
    list.innerHTML = rows.map(function (s) {
      var on = !!subs[s.id];
      var unavailable = s.status === "unavailable" || !s.live;
      var meta = unavailable ? "暂不可用" : ("今日" + (s.todayCount || (s.items && s.items.length) || 0) + "条");
      return '<li class="plaza-row"><div class="plaza-icon" style="background:' + (s.color || "#444") + '">' +
        escapeHtml(s.icon || s.name.slice(0, 1)) + '</div><div class="plaza-info"><div class="name">' +
        escapeHtml(s.name) + '</div><div class="meta">' + meta + '</div></div>' +
        '<button type="button" class="btn-sub' + (on ? " on" : "") + '" data-toggle="' + s.id + '">' +
        (on ? "已订阅" : (unavailable ? "暂不可用" : "订阅")) + "</button></li>";
    }).join("");
    $$("[data-toggle]", list).forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-toggle");
        var arr = loadSubs();
        var idx = arr.indexOf(id);
        if (idx >= 0) arr.splice(idx, 1); else arr.push(id);
        saveSubs(arr);
        renderPlaza();
        renderMine();
      };
    });
  }

  function renderAll() {
    try {
      setDateHeader();
      renderMorning();
      renderMine();
      renderTimeline();
      renderTech();
      renderChips();
      renderPlaza();
      var hint = $("updatedHint");
      if (hint) {
        hint.textContent = (DATA && DATA.updatedAtLabel)
          ? ("数据更新于 " + DATA.updatedAtLabel + "（北京时间）· 点击标题页内展开")
          : "已加载";
      }
      var meSub = $("meSub");
      if (meSub) meSub.textContent = "单页离线版 · 已订阅 " + loadSubs().length + " 个源";
    } catch (err) {
      var h = $("updatedHint");
      if (h) h.textContent = "渲染出错：" + (err && err.message ? err.message : String(err));
      if (window.console) console.error(err);
    }
  }

  function applyData(data) {
    if (!data || typeof data !== "object") return;
    if (!data.sources) data.sources = [];
    if (!data.morning) data.morning = [];
    if (!data.timeline) data.timeline = [];
    if (!data.techEvents) data.techEvents = [];
    DATA = data;
    try { if (!localStorage.getItem(SUBS_KEY)) saveSubs(defaultSubs()); } catch (e) {}
    renderAll();
  }

  function navTo(name) {
    $$(".page").forEach(function (p) {
      var on = p.getAttribute("data-page") === name;
      p.hidden = !on;
      if (on) p.classList.add("active"); else p.classList.remove("active");
    });
    $$(".tabbar .tab").forEach(function (t) {
      if (t.getAttribute("data-nav") === name) t.classList.add("active");
      else t.classList.remove("active");
    });
  }

  function broadcast() {
    var items = (DATA && DATA.morning) || [];
    if (!items.length || !window.speechSynthesis) return;
    if (speaking) {
      speechSynthesis.cancel();
      speaking = false;
      $("btnBroadcast").innerHTML = '<span class="play-dot"></span>一键播报';
      return;
    }
    speaking = true;
    $("btnBroadcast").innerHTML = '<span class="play-dot"></span>停止播报';
    var text = "今日早报。";
    for (var i = 0; i < items.length; i++) text += "第" + (i + 1) + "条，" + items[i].title + "。";
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 1.05;
    u.onend = function () {
      speaking = false;
      $("btnBroadcast").innerHTML = '<span class="play-dot"></span>一键播报';
    };
    speechSynthesis.speak(u);
  }

  function bind() {
    $$(".tabbar .tab").forEach(function (t) {
      t.onclick = function () { navTo(t.getAttribute("data-nav")); };
    });
    if ($("btnRefresh")) $("btnRefresh").onclick = function () { renderAll(); };
    if ($("btnBroadcast")) $("btnBroadcast").onclick = broadcast;
    if ($("btnLayout")) $("btnLayout").onclick = function () {
      layout = layout === "horizontal" ? "vertical" : "horizontal";
      try { localStorage.setItem(LAYOUT_KEY, layout); } catch (e) {}
      renderMine();
    };
    if ($("btnManage")) $("btnManage").onclick = function () { navTo("plaza"); };
    if ($("btnTimelineAll")) $("btnTimelineAll").onclick = function () {
      openSourceSheet({
        name: "24 小时热榜",
        items: ((DATA && DATA.timeline) || []).map(function (it) {
          return Object.assign({}, it, { summary: minsLabel(it.minsAgo) + " · " + (it.sourceName || "") });
        }),
        status: "ok"
      });
    };
    if ($("btnTechCal")) $("btnTechCal").onclick = function () {
      openSourceSheet({
        name: "科技大事",
        items: ((DATA && DATA.techEvents) || []).map(function (it) {
          return { title: it.title, summary: it.time + " · " + (it.place || ""), bullets: ["时间：" + it.time] };
        }),
        status: "ok"
      });
    };
    if ($("sheetBackdrop")) $("sheetBackdrop").onclick = closeSheet;
    if ($("sheetDismiss")) $("sheetDismiss").onclick = closeSheet;
    if ($("sourceBackdrop")) $("sourceBackdrop").onclick = closeSourceSheet;
    if ($("sourceSheetClose")) $("sourceSheetClose").onclick = closeSourceSheet;
    $$(".me-row").forEach(function (btn) {
      btn.onclick = function () {
        var k = btn.getAttribute("data-me");
        if (k === "subs") navTo("plaza");
        else if (k === "about") openSheet({
          title: "关于要知简报",
          summary: "单页离线版，数据已内嵌。点击标题只在页内展开。",
          bullets: ["无需加载外部 JS/CSS/JSON", "订阅状态保存在本机", "视觉参考软媒「要知」"],
          tags: ["关于"]
        }, { name: "要知简报" });
        else if (k === "history") {
          try {
            var arr = JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
            openSourceSheet({
              name: "阅读历史",
              items: arr.map(function (h) { return { title: h.title, summary: h.source || "" }; }),
              status: "ok"
            });
          } catch (e) { openSourceSheet({ name: "阅读历史", items: [], status: "ok" }); }
        } else if (k === "settings" || k === "fav") {
          openSheet({ title: k === "fav" ? "收藏" : "设置", summary: "单页内嵌版，刷新按钮会重绘当前数据。", bullets: ["无账号", "无外部请求"] }, { name: "我" });
        }
      };
    });
    if ($("btnSearch")) $("btnSearch").onclick = function () {
      var q = prompt("搜索当前标题");
      if (!q) return;
      q = q.trim();
      if (!q) return;
      var hits = [];
      var sources = (DATA && DATA.sources) || [];
      for (var i = 0; i < sources.length; i++) {
        var items = sources[i].items || [];
        for (var j = 0; j < items.length; j++) {
          if (items[j].title.indexOf(q) !== -1) {
            hits.push(Object.assign({}, items[j], { sourceName: sources[i].name, sourceId: sources[i].id }));
          }
        }
      }
      openSourceSheet({ name: "搜索：" + q, items: hits.slice(0, 30), status: "ok" });
    };
  }

  // Boot — data is already in INLINE_DATA
  setDateHeader();
  bind();
  applyData(window.INLINE_DATA || window.__YAOZHI_FALLBACK__ || { sources: [], morning: [], timeline: [], techEvents: [] });
  try {
    var tab = new URLSearchParams(location.search).get("tab");
    if (tab === "plaza" || tab === "me" || tab === "home") navTo(tab);
  } catch (e) {}
})();

</script>
</body>
</html>
